name: Deploy Production

on:
  push:
    branches:
      - production

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.BLOOMPOD_HOST }}
        username: ${{ secrets.BLOOMPOD_USERNAME }}
        key: ${{ secrets.BLOOMPOD_SSH_KEY }}
        script_stop: true
        script: |
          # Clone if not exists, otherwise update
          if [ ! -d ~/landing_page/pas_bloompod ]; then
            git clone git@github.com:IntelliSync-data/pas_bloompod.git ~/landing_page/pas_bloompod
            cd ~/landing_page/pas_bloompod && git checkout production
          else
            cd ~/landing_page/pas_bloompod
            git fetch origin && git reset --hard origin/production
          fi

          # Sync pas_bloompod directory with rsync (including deletions)
          sudo mkdir -p ~/pas_bloompod
          sudo rsync -av --delete \
            ~/landing_page/pas_bloompod/source-main/ ~/pas_bloompod/